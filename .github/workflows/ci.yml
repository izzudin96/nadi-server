name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        shell: bash

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # Integration tests need a real Postgres; run them on Linux with a service
  # container (service containers are Linux-only, hence the separate job).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nadi
          POSTGRES_PASSWORD: nadi
          POSTGRES_DB: nadi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nadi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test (with database)
        env:
          TEST_DATABASE_URL: postgres://nadi:nadi@localhost:5432/nadi?sslmode=disable
        run: go test ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile targets
        run: |
          for target in "linux amd64" "linux arm64" "darwin arm64" "darwin amd64" "windows amd64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -o bin/app-$1-$2 ./cmd/nadi-server
          done
