# Production stack: Postgres + the server (dashboard embedded in the image).
# Copy deploy/.env.example to deploy/.env, fill in strong secrets, then:
#   docker compose -f deploy/docker-compose.yml up -d
#
# IMPORTANT: this serves plain HTTP on :8080. Because NADI_SECURE_COOKIES
# defaults to true, you MUST put a TLS-terminating reverse proxy (Caddy, nginx,
# Traefik) in front of it or dashboard login will not work. See deploy/README.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nadi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nadi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nadi:${POSTGRES_PASSWORD}@postgres:5432/nadi?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NADI_SECURE_COOKIES: ${NADI_SECURE_COOKIES:-true}
      NADI_ALLOW_REGISTRATION: ${NADI_ALLOW_REGISTRATION:-auto}
      NADI_RETENTION_DAYS: ${NADI_RETENTION_DAYS:-30}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
