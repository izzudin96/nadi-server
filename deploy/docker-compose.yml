# Production stack: Postgres + the server (dashboard embedded in the image).
# Run with secrets supplied via environment, e.g.:
#   JWT_SECRET=$(openssl rand -hex 32) POSTGRES_PASSWORD=... docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nadi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nadi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nadi:${POSTGRES_PASSWORD}@postgres:5432/nadi?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      NADI_SECURE_COOKIES: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
